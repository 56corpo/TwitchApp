[package]
name = "twitch-app"
version = "2.0.0"
edition = "2021"
authors = ["56corpo (Xerty)"]
description = "Client Twitch Desktop ultra-léger en Rust (Wry/Tao) avec Anti-Pub HLS/GQL, Emotes 7TV/BTTV/FFZ et Discord Rich Presence"
repository = "https://github.com/56corpo/TwitchApp"
license = "ISC"

[dependencies]
tao = "0.30"
wry = { version = "0.47", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
discord-rich-presence = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
open = "5.3"
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
